# Work-only Codex defaults. Portable MCPs are managed by agent_config/sync-mcps.

[shell_environment_policy.set]
http_proxy = "http://fwdproxy:8080"
https_proxy = "http://fwdproxy:8080"
no_proxy = ".facebook.com,.facebook.net,.fbcdn.net,.fb.com,.fburl.com,.thefacebook.com,.tfbnw.net,.fbinfra.net,.sb.fbsbx.com,.internalfb.com,.intern.facebook.com,localhost,127.0.0.1,::1"
NO_PROXY = ".facebook.com,.facebook.net,.fbcdn.net,.fb.com,.fburl.com,.thefacebook.com,.tfbnw.net,.fbinfra.net,.sb.fbsbx.com,.internalfb.com,.intern.facebook.com,localhost,127.0.0.1,::1"

# Devservers are single-user, so every directory under $HOME is trusted. Codex
# resolves trust from the nearest ancestor entry and the Meta launcher refuses
# to start under an untrusted one, so checkouts need no entries of their own.
# As a template entry this also replaces an "untrusted" Codex recorded itself.
[projects."__HOME__"]
trust_level = "trusted"

# Claude-only plugins that agent_config/sync installs for every agent. Template
# entries win over the plugin state Codex records, so every sync reasserts these.
#
# meta_codesearch is tagged no-codex, but agent-market installs it for Codex
# anyway (T273473181). In Codex it contributes nothing but a SessionStart hook
# telling the model to use Claude-only tools (code-search agent, TaskOutput,
# ToolSearch). TODO: drop once agent-market honors no-codex.
[plugins."meta_codesearch@claude-templates"]
enabled = false

# Codex has no LSP client, so these ship only skills that direct it to an LSP
# tool it lacks.
[plugins."meta-lsp@claude-templates"]
enabled = false

[plugins."meta-lsp-buck2@claude-templates"]
enabled = false

[plugins."meta-lsp-cpp@claude-templates"]
enabled = false

[plugins."meta-lsp-go@claude-templates"]
enabled = false

[plugins."meta-lsp-pyrefly@claude-templates"]
enabled = false

[plugins."meta-lsp-rust@claude-templates"]
enabled = false

[plugins."meta-lsp-thrift@claude-templates"]
enabled = false
