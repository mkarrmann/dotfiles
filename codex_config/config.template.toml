# Shared Codex defaults. Machine-specific overrides belong in
# ~/.codex/config.local.toml. sync.sh merges its parsed TOML over this
# template and the managed MCP definitions to generate ~/.codex/config.toml.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "fast"

# Codex writes runtime state to config.toml. Sync preserves its state tables;
# explicit template or config.local.toml settings take precedence.
