# Rotation for Omnigent logs that systemd owns via `StandardOutput=append:`.
#
# Driven by omnigent-logrotate.timer (hourly). State lives in
# ~/.local/state/omnigent-logrotate/logrotate.status, so this never touches the
# system-wide logrotate state and needs no root.
#
# copytruncate is required, not cosmetic: systemd holds the log fd open for the
# lifetime of the unit, so a rename would leave the daemon writing to an
# unlinked inode until its next restart. The fd is opened O_APPEND, so writes
# resume at the new end of file immediately after truncation.
#
# Only files this repo's units write are listed. Do NOT add ~/.omnigent/logs/**
# — the omnigent server/host/runner processes manage those themselves, one file
# per start, and rotating underneath them would fight that scheme.

/home/mkarrmann/.omnigent/google-chat.log {
    hourly
    rotate 5
    size 32M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    create 0600 mkarrmann users
}

# The StateDirectory= logs. Every unit below writes here through systemd's
# append: redirection, so the same copytruncate reasoning applies. No `create`:
# copytruncate keeps the original inode, so the file's existing mode is
# preserved and a create stanza would only misdescribe it (these range from
# 0600 under UMask=0077 to 0644).
#
# proxy.log and reconcile.log are the chatty ones -- they were 29M and 26M
# after a month, unrotated, because this file used to list google-chat.log
# alone.
/home/mkarrmann/.local/state/omnigent-client-proxy/proxy.log
/home/mkarrmann/.local/state/omnigent-diff-watcher/service.log
/home/mkarrmann/.local/state/omnigent-host/host.log
/home/mkarrmann/.local/state/omnigent-hub/reconcile.log
/home/mkarrmann/.local/state/omnigent-hub/snapshot.log
/home/mkarrmann/.local/state/omnigent-prodnet/proxy.log
/home/mkarrmann/.local/state/omnigent-server/server.log {
    hourly
    rotate 5
    size 32M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
