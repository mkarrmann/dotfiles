spec_version: 1
name: muse
description: >-
  Meta's Muse Code, served over the Agent Client Protocol by its own
  `muse acp` command. The managed /usr/local/bin/muse launcher owns identity
  and inference (AI Gateway, Meta Model API). Sessions start on muse-latest;
  the model is selectable at launch and mid-session, and reasoning effort
  uses Muse's default, since the generic ACP harness has no channel for it.

# `acp:muse-core` resolves to the `muse-core` entry in the `acp:` block of
# ~/.omnigent/config.yaml (added by `omnigent-dvsc-ensure`). Muse owns the
# system prompt and tool loop, so this spec declares no `prompt:`.
executor:
  type: omnigent
  config:
    harness: acp:muse-core
    # ACP otherwise falls back to a human prompt whenever policy returns ALLOW
    # or abstains. Explicit DENY/ASK policies still win over this default.
    permission_mode: bypassPermissions

tools:
  watch:
    type: mcp
    command: omnigent-watch-mcp
    tools:
      - diff_subscribe
      - diff_unsubscribe
      - diff_status
      - subscribe
      - unsubscribe
      - status
