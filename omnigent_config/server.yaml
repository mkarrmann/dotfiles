# Omnigent server config, passed via `--config` from the systemd unit
# (~/dotfiles/systemd/omnigent-server.service).
#
# The published uv-tool install reads NO config unless `--config` is given, so
# everything below is opt-in. It layers out-of-tree policies onto the server
# without patching the installed package. The policy module root is placed on
# PYTHONPATH by the systemd unit.

# Extra policy modules to import at startup (dotted module paths, resolved via
# PYTHONPATH). Their POLICY_REGISTRY entries are merged into the registry.
policy_modules:
  - no_foreground_wait

# Server-wide default policies, appended after per-agent policies for EVERY
# session. `type: function` self-selects its phase, so no `on:` is needed.
policies:
  # Refuse a shell command that blocks the turn on a long sleep — waiting in-turn
  # spends a model turn to produce nothing, and every harness can detach instead.
  # Enforced here rather than as per-harness PreToolUse hooks because one policy
  # covers everything Omnigent fronts; hooks would miss native Codex entirely,
  # which runs under a private CODEX_HOME that never reads ~/.codex/hooks.json.
  # A session started outside Omnigent is not gated; the waiting-without-polling
  # skill still reaches it.
  no_foreground_wait:
    type: function
    function:
      path: no_foreground_wait.block_foreground_wait
      arguments:
        action: deny
