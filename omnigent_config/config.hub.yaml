# Omnigent server keys that only make sense on a work hub candidate.
#
# Merged into ~/.omnigent/config.yaml by bin/omnigent-config-ensure, after
# config.shared.yaml, on hosts where `omnigent-server-url --is-candidate`
# holds (the primary and standby in topology.env). Everything universal
# belongs in config.shared.yaml; this file exists so a desktop's managed
# server is not asked to import packages that only the hub installs.

# Out-of-tree HTTP routers, mounted by dotted module path at startup.
#
# The watcher's tools run wherever the agent runs, but watching happens on the
# hub: the sidecar, its database, and the sessions it wakes are all here, and
# every omnigent unit carries ExecCondition=omnigent-hub gate. The tools used
# to open the database by path, which on any other devserver meant an empty
# file no sidecar ever polls -- a watch that was accepted and then never fired.
# Mounting the watcher's API here puts it behind the same 127.0.0.1:6767
# forward the tools already use, so no second tunnel needs health-checking.
# The package is importable because systemd/omnigent-server.service puts
# services/omnigent-watcher/src on PYTHONPATH.
debug_router_modules:
  - omnigent_watcher.http_api
