# Installed by bin/coredump-size-cap-ensure to /etc/systemd/coredump.conf.d/.
#
# systemd 256 raised the default ProcessSizeMax/ExternalSizeMax from 2G to 32G.
# A crashing Chromium/Electron main process has tens of GB of reserved address
# space, so the kernel streams a core that large into systemd-coredump's temp
# file, fills the root filesystem for ~a minute, and the dump is then discarded
# anyway. Restore the pre-256 cap; nothing here needs cores that big.
[Coredump]
ProcessSizeMax=2G
ExternalSizeMax=2G
